<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0C0C0C">
<title>FGF Control Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F7901E'/%3E%3Ctext x='16' y='22' font-family='Roboto,Arial' font-size='16' font-weight='700' text-anchor='middle' fill='white'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#F7901E;
    --grey:#585858;
    --dark:#0C0C0C;
    --panel:#1a1a1a;
    --text:#f2f2f2;
    --muted:#9a9a9a;
    --line:#2a2a2a;
  }
  @media (prefers-color-scheme: light){
    :root{--dark:#f5f5f5;--panel:#ffffff;--text:#0C0C0C;--muted:#585858;--line:#e3e3e3}
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--dark);color:var(--text);
    font-family:Roboto,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 24px;border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:22px;letter-spacing:.2px}
  .brand .fgf{font-weight:700;color:var(--orange)}
  .brand .prod{font-weight:300;color:var(--orange)}
  .brand .logo{height:34px;width:auto;display:block}
  .brand .tag{
    font-size:12px;color:var(--muted);border-left:1px solid var(--line);
    padding-left:10px;margin-left:4px;text-transform:uppercase;letter-spacing:1.5px;font-weight:500
  }
  main{max-width:960px;margin:0 auto;padding:32px 24px 56px}
  h1{font-size:14px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin:0 0 18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
  a.app, .app{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
    padding:20px 12px 16px;border-radius:18px;background:var(--panel);
    border:1px solid var(--line);color:inherit;text-decoration:none;
    transition:transform .15s ease,border-color .15s ease;
  }
  a.app:hover{transform:translateY(-2px);border-color:var(--orange)}
  .app.soon{opacity:.45;cursor:default}
  .icon{
    width:64px;height:64px;border-radius:16px;display:grid;place-items:center;
    font-size:28px;font-weight:700;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)
  }
  .name{font-weight:500;font-size:15px}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.35}
  .badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 24px 32px}
  @media (max-width:520px){
    header{padding:18px 16px}.brand{font-size:19px}.brand .tag{display:none}
    main{padding:24px 16px 40px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <picture>
      <source srcset="logo-gris.png" media="(prefers-color-scheme: light)">
      <img src="logo-taronja.png" alt="fgfproduccions" class="logo">
    </picture>
    <span class="tag">Control Center</span>
  </div>
</header>

<main>
  <h1>Apps</h1>
  <div class="grid" id="grid"></div>
</main>

<footer>FGFproduccions · Cada app té el seu propi accés.</footer>

<script src="apps.js"></script>
<script>
  const grid = document.getElementById('grid');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  grid.innerHTML = APPS.map((a) => {
    const active = a.estat === 'activa' && a.url;
    const tag = active ? 'a' : 'div';
    const href = active ? ` href="${esc(a.url)}" target="_blank" rel="noopener"` : '';
    return `<${tag} class="app${active ? '' : ' soon'}"${href}>
      <div class="icon" style="background:${esc(a.color || '#F7901E')}">${esc(a.icona)}</div>
      <div class="name">${esc(a.nom)}</div>
      <div class="desc">${esc(a.descripcio)}</div>
      ${active ? '' : '<span class="badge">Properament</span>'}
    </${tag}>`;
  }).join('');
</script>
</body>
</html>
